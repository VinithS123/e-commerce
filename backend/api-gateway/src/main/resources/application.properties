server.port=${PORT:8080}
spring.application.name=api-gateway

#Eureka Client Configuration
eureka.client.service-url.default-zone=http://localhost:8761/eureka

#Route for Product Service
#Name to the route
spring.cloud.gateway.server.webflux.routes[0].id=product-service

#its like destination to address for request
spring.cloud.gateway.server.webflux.routes[0].uri=lb://product-service

#Checks condition i.e path
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/product/**

#filter for removing first part of path as stripPrefix=1
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1


spring.cloud.gateway.server.webflux.routes[1].id=inventory-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://inventory-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/inventory/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[2].id=order-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/order/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1
